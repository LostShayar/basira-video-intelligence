name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt numpy opencv-python-headless supervision trackers
      - name: Lint
        run: ruff check . --exit-zero
      - name: Test
        run: pytest -q
