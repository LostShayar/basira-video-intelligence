# Basira camera and analytics configuration.
# Every threshold lives here, never hard-coded in Python.
#
# Zones and lines use FRACTIONS of the frame, not pixels:
#   [0.0, 0.0] = top-left corner, [1.0, 1.0] = bottom-right corner.
# So the same config works for any video resolution.
# To draw your own: python scripts/draw_zones.py --camera cam_01

model:
  weights: yolo11n.pt          # downloaded automatically by Ultralytics, gitignored
  confidence: 0.35
  classes: [person, car, motorcycle, bus, truck]

privacy:
  blur_faces: true
  retention_days: 7

cameras:
  - id: cam_01
    name: Plaza North
    source: data/plaza_north.mp4   # later: rtsp://...
    zones:
      - id: crossing
        type: crowd
        classes: [person]
        polygon: [[0.0, 0.45], [1.0, 0.45], [1.0, 1.0], [0.0, 1.0]]
        max_people: 25             # alert when more than 25 people are inside
    lines:
      - id: centre_line            # counts people walking left/right across the road
        start: [0.5, 0.40]
        end: [0.5, 1.0]

  - id: cam_02
    name: Main Road
    source: data/main_road.mp4
    zones: []
    lines:
      - id: road_count             # counts vehicles driving towards / away from camera
        start: [0.0, 0.80]
        end: [1.0, 0.80]

  - id: cam_03
    name: Station Entrance
    source: data/station.mp4
    zones:
      - id: tracks                 # nobody should be on the tracks
        type: restricted
        classes: [person]          # only people trigger this zone (trains don't)
        polygon: [[0.31, 0.55], [0.35, 0.55], [0.78, 1.0], [0.43, 1.0]]
      - id: platform
        type: loitering
        classes: [person]
        dwell_seconds: 10          # demo value; real sites usually use 30-120 s
        polygon: [[0.0, 0.55], [0.26, 0.55], [0.26, 1.0], [0.0, 1.0]]
    lines: []

analytics:
  loitering:
    threshold_seconds: 30          # default for loitering zones; a zone can override it
  events:
    cooldown_seconds: 20           # minimum gap between repeated crowding alerts
    clip_seconds_before: 5
    clip_seconds_after: 5
