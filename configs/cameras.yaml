# Basira camera and analytics configuration.
# Every threshold lives here, never hard-coded in Python.

model:
  weights: yolo11n.pt          # downloaded automatically by Ultralytics, gitignored
  confidence: 0.35
  classes: [person, car, motorcycle, bus, truck]

privacy:
  blur_faces: true
  retention_days: 7

cameras:
  - id: cam_01
    name: Plaza North
    source: data/plaza_north.mp4   # later: rtsp://...
    zones:
      - id: restricted_01
        type: restricted
        polygon: [[820, 410], [1180, 410], [1180, 700], [820, 700]]
      - id: plaza_01
        type: crowd
        polygon: [[100, 300], [800, 300], [800, 900], [100, 900]]
        max_people: 25
    lines:
      - id: entrance
        start: [200, 600]
        end: [1000, 600]

  - id: cam_02
    name: Main Road
    source: data/main_road.mp4
    zones: []
    lines:
      - id: road_count
        start: [0, 540]
        end: [1920, 540]

  - id: cam_03
    name: Station Entrance
    source: data/station.mp4
    zones:
      - id: loiter_01
        type: loitering
        polygon: [[300, 300], [900, 300], [900, 800], [300, 800]]
    lines: []

analytics:
  loitering:
    threshold_seconds: 30
  events:
    cooldown_seconds: 20
    clip_seconds_before: 5
    clip_seconds_after: 5
